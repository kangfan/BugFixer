[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bugfixer"
version = "0.3.1"
description = "Evidence retrieval and prepared ZenTao repair delivery for zentao_maintainer"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.scripts]
bugfixer = "bugfixer.cli:main"

[tool.setuptools.packages.find]
include = ["bugfixer*"]
